services:
  db:
    image: postgres:18
    container_name: logiciel_projet_db
    environment:
      POSTGRES_DB: logiciel_projet
      POSTGRES_USER: logiciel_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: